# Preview do site no GitHub Pages: a cada push na main, gera o _site/ e publica em
# https://fabianokunst.github.io/iplace-uy-corporativo/
# Requer Settings > Pages > Source = "GitHub Actions".
name: Preview no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # O Pages serve o site em /iplace-uy-corporativo/, então os links "/..." ganham esse prefixo.
      - run: npm run build -- --pathprefix="${{ steps.pages.outputs.base_path }}/"
      # A política é copiada como está (não passa pelo Eleventy), então o prefixo vai aqui.
      - run: sed -i 's#src="/integrations/#src="${{ steps.pages.outputs.base_path }}/integrations/#g' _site/politica-de-privacidad.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
